[package]
name = "gleipnir"
version = "0.1.0"
edition = '2024'

description = "A native Rust Sandbox Library compatible with python"
keywords = [
    "sandbox",
    "linux",
    "python"
]

license = "MIT OR Apache-2.0"
readme = "README.md"
authors = [
    "Alessio Maroni <https://github.com/alessioMaroni>"
]
repository = "https://github.com/alessioMaroni/gleipnir"

include = [
    "src/**/*",
    "README.md",
    "LICENSE*",
    "Cargo.toml"
]

exclude = []

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process"] }

[lib]
crate-type = [
    "cdylib", 
    "rlib"
]

[lints.rust]
unsafe_code = "deny"
